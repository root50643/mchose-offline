name: Deploy offline site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test offline cache and local server
        run: node tools/test-offline.mjs
      - name: Test frozen offline runtime
        run: node tools/test-runtime.mjs
      - name: Verify exact official snapshot filenames
        run: node tools/snapshot.mjs --verify-official-paths-only
      - name: Verify every mouse model and explicit upstream outages
        run: node tools/test-model-assets.mjs --accept-known-source-404
      - name: Build and verify offline cache manifest
        run: node tools/build-offline.mjs
      - name: Verify archived sources and deployed resource references
        run: node tools/verify.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
