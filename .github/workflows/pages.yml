name: Deploy M HUB frontend mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build factory frontend mirror
        run: node tools/build-mirror.mjs
      - name: Verify mirrored static resources
        run: node tools/verify-mirror.mjs
      - name: Test mirror behavior
        run: node tools/test-mirror.mjs
      - name: Test configuration resource mapping
        run: node tools/test-mirror-config.mjs
      - name: Test project storage events
        run: node tools/test-mirror-storage-events.mjs
      - name: Test previous-version cache cleanup
        run: node tools/test-mirror-cleanup.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
